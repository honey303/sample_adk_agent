<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 910" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#202124"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5F6368"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="910" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="30" y="32" font-size="21" font-weight="700" fill="#202124">Inventory Assistant: Cloud Run + Enterprise VPC Governance</text>
  <text x="30" y="52" font-size="12.5" fill="#5F6368">Runtime request path (solid, numbered) and build/deploy path (dashed gray) — matches infra/*.tf and scripts/setup_infra_gcloud.sh</text>

  <!-- Legend -->
  <g>
    <rect x="990" y="12" width="380" height="163" rx="6" fill="#FAFAFA" stroke="#DADCE0"/>
    <text x="1006" y="30" font-size="12" font-weight="700" fill="#202124">Legend</text>

    <rect x="1006" y="40" width="16" height="12" rx="2" fill="#E8F0FE" stroke="#1A73E8"/>
    <text x="1030" y="50" font-size="11" fill="#3C4043">Compute / serverless (Cloud Run, Cloud Build)</text>

    <rect x="1006" y="56" width="16" height="12" rx="2" fill="#E6F4EA" stroke="#188038"/>
    <text x="1030" y="66" font-size="11" fill="#3C4043">Networking (VPC, subnet, connector, NAT)</text>

    <rect x="1006" y="72" width="16" height="12" rx="2" fill="#FCE8E6" stroke="#D93025"/>
    <text x="1030" y="82" font-size="11" fill="#3C4043">Identity / IAM</text>

    <rect x="1006" y="88" width="16" height="12" rx="2" fill="#FEF7E0" stroke="#F9AB00"/>
    <text x="1030" y="98" font-size="11" fill="#3C4043">Secrets / Artifact Registry</text>

    <rect x="1006" y="104" width="16" height="12" rx="2" fill="#F3E8FD" stroke="#A142F4"/>
    <text x="1030" y="114" font-size="11" fill="#3C4043">AI / model API</text>

    <line x1="1006" y1="126" x2="1022" y2="126" stroke="#202124" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="1030" y="130" font-size="11" fill="#3C4043">Runtime request (numbered)</text>

    <line x1="1006" y1="142" x2="1022" y2="142" stroke="#5F6368" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow-gray)"/>
    <text x="1030" y="146" font-size="11" fill="#3C4043">Build / deploy time</text>

    <rect x="1006" y="153" width="16" height="10" fill="none" stroke="#80868B" stroke-dasharray="3,2"/>
    <text x="1030" y="162" font-size="11" fill="#3C4043">Trust / network boundary</text>
  </g>

  <!-- Project boundary -->
  <rect x="20" y="200" width="1360" height="650" rx="14" fill="none" stroke="#5F6368" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="38" y="218" font-size="12" font-weight="700" fill="#5F6368" letter-spacing="0.5">GOOGLE CLOUD PROJECT — your-gcp-project</text>

  <!-- Build/deploy lane -->
  <rect x="50" y="230" width="150" height="55" rx="8" fill="#F1F3F4" stroke="#5F6368"/>
  <text x="125" y="253" font-size="12" font-weight="700" text-anchor="middle" fill="#202124">Developer</text>
  <text x="125" y="269" font-size="9.5" text-anchor="middle" fill="#5F6368">./scripts/deploy.sh</text>

  <line x1="200" y1="257" x2="238" y2="257" stroke="#5F6368" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow-gray)"/>

  <rect x="240" y="230" width="170" height="55" rx="8" fill="#E8F0FE" stroke="#1A73E8"/>
  <text x="325" y="253" font-size="12" font-weight="700" text-anchor="middle" fill="#174EA6">Cloud Build</text>
  <text x="325" y="269" font-size="9.5" text-anchor="middle" fill="#174EA6">gcloud builds submit</text>

  <line x1="410" y1="257" x2="448" y2="257" stroke="#5F6368" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow-gray)"/>

  <rect x="450" y="230" width="200" height="55" rx="8" fill="#FEF7E0" stroke="#F9AB00"/>
  <text x="550" y="253" font-size="12" font-weight="700" text-anchor="middle" fill="#B06000">Artifact Registry</text>
  <text x="550" y="269" font-size="9.5" text-anchor="middle" fill="#B06000">adk-agents repo</text>

  <text x="670" y="263" font-size="10.5" fill="#5F6368">→ setup_infra_gcloud.sh runs "gcloud run deploy" to roll out the new image below</text>

  <!-- Region boundary -->
  <rect x="40" y="305" width="1320" height="525" rx="12" fill="none" stroke="#80868B" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="58" y="323" font-size="12" font-weight="700" fill="#80868B" letter-spacing="0.5">REGION — us-central1</text>

  <!-- Authorized caller -->
  <rect x="70" y="345" width="220" height="70" rx="8" fill="#F1F3F4" stroke="#5F6368"/>
  <text x="180" y="368" font-size="12" font-weight="700" text-anchor="middle" fill="#202124">Authorized caller</text>
  <text x="180" y="384" font-size="10" text-anchor="middle" fill="#5F6368">internal, IAM-authenticated</text>
  <text x="180" y="398" font-size="10" text-anchor="middle" fill="#5F6368">(e.g. test VM via IAP)</text>

  <line x1="180" y1="415" x2="180" y2="443" stroke="#202124" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="195" y="433" font-size="10.5" font-weight="700" fill="#202124">① HTTPS + Bearer identity token</text>

  <!-- Cloud Run -->
  <rect x="70" y="445" width="290" height="195" rx="8" fill="#E8F0FE" stroke="#1A73E8" stroke-width="1.5"/>
  <text x="215" y="468" font-size="13" font-weight="700" text-anchor="middle" fill="#174EA6">Cloud Run service</text>
  <text x="215" y="484" font-size="11" text-anchor="middle" fill="#174EA6">inventory-assistant-agent</text>
  <line x1="85" y1="493" x2="345" y2="493" stroke="#AECBFA"/>
  <text x="85" y="509" font-size="9.5" fill="#174EA6">ingress: internal-and-cloud-load-balancing</text>
  <text x="85" y="523" font-size="9.5" fill="#174EA6">vpc-egress: private-ranges-only</text>
  <text x="85" y="537" font-size="9.5" fill="#174EA6">no unauthenticated invokers</text>
  <line x1="85" y1="546" x2="345" y2="546" stroke="#AECBFA"/>
  <text x="85" y="562" font-size="9.5" font-weight="700" fill="#A50E0E">SA: inventory-assistant-run</text>
  <text x="85" y="576" font-size="9" fill="#A50E0E">roles/aiplatform.user</text>
  <text x="85" y="588" font-size="9" fill="#A50E0E">roles/secretmanager.secretAccessor</text>
  <text x="85" y="604" font-size="9" fill="#5F6368">FastAPI: /healthz · /invoke</text>

  <!-- Cloud Run -> connector -->
  <line x1="360" y1="480" x2="478" y2="480" stroke="#202124" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="419" y="440" font-size="10" font-weight="700" text-anchor="middle" fill="#202124">② private call</text>

  <!-- VPC boundary -->
  <rect x="440" y="345" width="560" height="320" rx="10" fill="none" stroke="#188038" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="456" y="363" font-size="12" font-weight="700" fill="#188038" letter-spacing="0.5">VPC NETWORK — adk-agents-vpc</text>

  <!-- Subnet boundary -->
  <rect x="456" y="382" width="290" height="260" rx="8" fill="none" stroke="#34A853" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="468" y="399" font-size="10.5" font-weight="700" fill="#137333">SUBNET — adk-agents-vpc-subnet</text>
  <text x="468" y="412" font-size="9.5" fill="#137333">10.10.0.0/24 · Private Google Access</text>

  <rect x="480" y="450" width="240" height="60" rx="8" fill="#E6F4EA" stroke="#188038"/>
  <text x="600" y="472" font-size="11" font-weight="700" text-anchor="middle" fill="#137333">Serverless VPC Access connector</text>
  <text x="600" y="487" font-size="9.5" text-anchor="middle" fill="#137333">adk-agents-vpc-conn · 10.10.8.0/28</text>

  <line x1="600" y1="510" x2="600" y2="538" stroke="#202124" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="480" y="540" width="240" height="80" rx="8" fill="#F1F3F4" stroke="#80868B" stroke-dasharray="4,3"/>
  <text x="600" y="562" font-size="10.5" font-weight="700" text-anchor="middle" fill="#3C4043">inventory-api.internal</text>
  <text x="600" y="577" font-size="9" text-anchor="middle" fill="#5F6368">example internal backend —</text>
  <text x="600" y="590" font-size="9" text-anchor="middle" fill="#5F6368">not provisioned by this repo;</text>
  <text x="600" y="603" font-size="9" text-anchor="middle" fill="#5F6368">see mock_internal_api.py for testing</text>

  <!-- Router/NAT + firewall -->
  <rect x="760" y="450" width="220" height="75" rx="8" fill="#E6F4EA" stroke="#188038"/>
  <text x="870" y="472" font-size="11" font-weight="700" text-anchor="middle" fill="#137333">Cloud Router + Cloud NAT</text>
  <text x="870" y="487" font-size="9" text-anchor="middle" fill="#137333">adk-agents-vpc-router / -nat</text>
  <text x="870" y="500" font-size="9" text-anchor="middle" fill="#137333">egress for non-RFC1918 traffic</text>

  <rect x="760" y="540" width="220" height="80" rx="8" fill="#E6F4EA" stroke="#188038" stroke-dasharray="4,3"/>
  <text x="870" y="561" font-size="10.5" font-weight="700" text-anchor="middle" fill="#137333">Firewall (deny-by-default)</text>
  <text x="870" y="575" font-size="8.5" text-anchor="middle" fill="#137333">deny all egress, priority 65534</text>
  <text x="870" y="587" font-size="8.5" text-anchor="middle" fill="#137333">allow 443/8080 → subnet + connector</text>
  <text x="870" y="599" font-size="8.5" text-anchor="middle" fill="#137333">allow 443 → private.googleapis.com (199.36.153.8/30)</text>

  <!-- Row: IAM note / Secret Manager / Vertex AI -->
  <rect x="70" y="700" width="250" height="90" rx="8" fill="#FCE8E6" stroke="#D93025" stroke-dasharray="4,3"/>
  <text x="195" y="722" font-size="11" font-weight="700" text-anchor="middle" fill="#A50E0E">roles/run.invoker</text>
  <text x="195" y="738" font-size="9.5" text-anchor="middle" fill="#A50E0E">empty allow-list by default —</text>
  <text x="195" y="751" font-size="9.5" text-anchor="middle" fill="#A50E0E">set AUTHORIZED_INVOKERS to grant</text>
  <text x="195" y="764" font-size="9.5" text-anchor="middle" fill="#A50E0E">specific callers; no allUsers ever</text>

  <rect x="360" y="700" width="220" height="90" rx="8" fill="#FEF7E0" stroke="#F9AB00"/>
  <text x="470" y="724" font-size="12" font-weight="700" text-anchor="middle" fill="#B06000">Secret Manager</text>
  <text x="470" y="740" font-size="9.5" text-anchor="middle" fill="#B06000">inventory-assistant-internal-key</text>
  <text x="470" y="754" font-size="9" text-anchor="middle" fill="#B06000">mounted as INTERNAL_API_KEY</text>

  <rect x="620" y="700" width="240" height="90" rx="45" fill="#F3E8FD" stroke="#A142F4"/>
  <text x="740" y="724" font-size="12" font-weight="700" text-anchor="middle" fill="#7627BB">Vertex AI / Gemini API</text>
  <text x="740" y="740" font-size="9.5" text-anchor="middle" fill="#7627BB">gemini-2.5-flash</text>
  <text x="740" y="754" font-size="9" text-anchor="middle" fill="#7627BB">Google-managed, reached privately</text>

  <!-- Cloud Run -> Secret Manager (③) -->
  <path d="M 300 640 L 300 675 L 470 675 L 470 700" fill="none" stroke="#202124" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="220" y="667" font-size="10.5" font-weight="700" fill="#202124">③ read INTERNAL_API_KEY</text>

  <!-- Cloud Run -> Vertex AI (④) -->
  <path d="M 335 640 L 335 688 L 740 688 L 740 700" fill="none" stroke="#202124" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="500" y="680" font-size="10.5" font-weight="700" fill="#202124">④ generateContent() via private.googleapis.com</text>

  <!-- Caption -->
  <text x="30" y="870" font-size="10.5" fill="#5F6368">Boundaries nest project → region → VPC network → subnet, each narrower than its parent. Cloud Run is drawn outside the VPC boundary — it is a</text>
  <text x="30" y="886" font-size="10.5" fill="#5F6368">serverless resource, not VPC-native — and reaches in only via the Serverless VPC Access connector (②), taking a separate direct path to Google APIs (③④).</text>
</svg>
